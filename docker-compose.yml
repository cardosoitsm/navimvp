version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Navi MVP
      APP_ENV: development
      APP_DEBUG: "false"
      ACCOUNT_SID: ${ACCOUNT_SID:-}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      TWILIO_NUMBER: ${TWILIO_NUMBER:-}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret}
      ALGORITHM: ${ALGORITHM:-HS256}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_HOST: db
      DATABASE_NAME: navimvp
      DATABASE_USER: navimvp
      DATABASE_PASSWORD: navimvppw
      DATABASE_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: navimvp
      POSTGRES_PASSWORD: navimvppw
      POSTGRES_DB: navimvp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navimvp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
