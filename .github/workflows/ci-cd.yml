name: CI / CD

on:
  push:
    branches: [ main, feature/hom-deploy ]
  workflow_dispatch:

env:
  IMAGE_NAME: navimvp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./app/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment files
        run: |
          test -f docker-compose.prod.yml
          test -f db/init.sql

      - name: Login to Azure CLI
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Build deploy script
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          ACCOUNT_SID: ${{ secrets.ACCOUNT_SID }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          TWILIO_NUMBER: ${{ secrets.TWILIO_NUMBER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: python3 .github/scripts/build_deploy.py

      - name: Start Azure VM
        run: |
          az vm start \
            --resource-group navimvp-hom-rg \
            --name navimvp-hom-vm
          echo "VM is running"

      - name: Ensure NSG allows port 8000
        run: |
          NIC_ID=$(az vm show \
            --resource-group navimvp-hom-rg \
            --name navimvp-hom-vm \
            --query "networkProfile.networkInterfaces[0].id" -o tsv)
          NSG_ID=$(az network nic show --ids "$NIC_ID" \
            --query "networkSecurityGroup.id" -o tsv)
          NSG_NAME=$(az network nsg show --ids "$NSG_ID" --query name -o tsv)
          az network nsg rule create \
            --resource-group navimvp-hom-rg \
            --nsg-name "$NSG_NAME" \
            --name allow-8000 \
            --priority 1010 \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --destination-port-ranges 8000 2>/dev/null \
            || echo "NSG rule allow-8000 already exists — skipping"

      - name: Deploy to Azure VM (SSH-free via Azure CLI)
        run: |
          az vm run-command invoke \
            --resource-group navimvp-hom-rg \
            --name navimvp-hom-vm \
            --command-id RunShellScript \
            --scripts @/tmp/deploy.sh
