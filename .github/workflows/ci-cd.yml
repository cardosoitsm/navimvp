name: CI / CD

on:
  push:
    branches: [ main, feature/hom-deploy ]
  workflow_dispatch:

env:
  IMAGE_NAME: navimvp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./app/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACCOUNT_SID: ${{ secrets.ACCOUNT_SID }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
      TWILIO_NUMBER: ${{ secrets.TWILIO_NUMBER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: HS256
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
     
      - name: Verify deployment files
        run: |
          ls -la
          ls -la db
          test -f docker-compose.prod.yml
          test -f db/init.sql

      - name: Copy deployment files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source : "docker-compose.prod.yml,db"
          target: "/home/${{ secrets.VM_SSH_USER }}/navimvp/"

      - name: SSH deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ACR_REGISTRY,ACCOUNT_SID,AUTH_TOKEN,TWILIO_NUMBER,OPENAI_API_KEY,SECRET_KEY,ALGORITHM,DATABASE_PASSWORD
          script: |
            set -e

            APP_DIR=/home/${{ secrets.VM_SSH_USER }}/navimvp
            mkdir -p "$APP_DIR/db"
            cd "$APP_DIR"

            printf "%s\n" \
              "ACR_REGISTRY=${ACR_REGISTRY}" \
              "ACCOUNT_SID=${ACCOUNT_SID}" \
              "AUTH_TOKEN=${AUTH_TOKEN}" \
              "TWILIO_NUMBER=${TWILIO_NUMBER}" \
              "OPENAI_API_KEY=${OPENAI_API_KEY}" \
              "SECRET_KEY=${SECRET_KEY}" \
              "ALGORITHM=${ALGORITHM}" \
              "DATABASE_PASSWORD=${DATABASE_PASSWORD}" > .env

            echo "${{ secrets.ACR_PASSWORD }}" | docker login "${ACR_REGISTRY}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            compose() {
              if docker compose version >/dev/null 2>&1; then
                docker compose "$@"
              elif command -v docker-compose >/dev/null 2>&1; then
                docker-compose "$@"
              else
                echo "Docker Compose is not available on the VM"
                exit 1
              fi
            }

            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate

